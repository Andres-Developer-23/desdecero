# Verifica cada pull request y cada cambio en main.
# Si todo pasa en main, publica dist/ en GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# En un pull request, un push nuevo cancela la verificación anterior.
# En main nunca se cancela, para no cortar una publicación a medias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Formato, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas en navegador
        run: npm run test:e2e

      - name: Guardar el informe si fallan las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: test-results/
          retention-days: 7

  publicar:
    name: Publicar en GitHub Pages
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar la página
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
